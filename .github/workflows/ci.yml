name: CI

on:
  push:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Strip local NuGet source
        run: dotnet nuget remove source local-crud-artifacts || true

      - name: Restore dependencies
        run: dotnet restore pengdows.hangfire.slnx -p:NuGetAudit=false

      - name: Build solution
        run: dotnet build pengdows.hangfire.slnx --no-restore --configuration Release

      - name: Run unit tests
        run: |
          dotnet test pengdows.hangfire.tests/pengdows.hangfire.tests.csproj \
            --no-build --configuration Release \
            --blame-hang --blame-hang-timeout 120s

      - name: Enforce no TransactionScope usage
        run: |
          set -euo pipefail

          if grep -rn --include='*.cs' -E 'new\s+TransactionScope|using\s+System\.Transactions' \
            pengdows.hangfire \
            pengdows.hangfire.tests \
            pengdows.hangfire.integration.tests; then
            echo "TransactionScope usage is forbidden. Use BeginTransactionAsync()."
            exit 1
          fi

  stress-provider-matrix:
    name: Stress - ${{ matrix.provider }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        provider:
          - postgres
          - sqlserver
          - mysql
          - mariadb
          - sqlite
          - duckdb
          - shared

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Strip local NuGet source
        run: dotnet nuget remove source local-crud-artifacts || true

      - name: Run ${{ matrix.provider }} stress tests
        run: ./run-stress-tests.sh "${{ matrix.provider }}"

      - name: Upload ${{ matrix.provider }} stress results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-results-${{ matrix.provider }}
          path: TestResults/stress/${{ matrix.provider }}/
          if-no-files-found: ignore

  integration-provider-matrix:
    name: Integration - ${{ matrix.provider }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        provider:
          - Sqlite
          - Postgres
          - SqlServer
          - MySql
          - Oracle
          - Firebird
          - CockroachDb
          - MariaDb
          - DuckDb
          - YugabyteDb
          - TiDb

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Strip local NuGet source
        run: dotnet nuget remove source local-crud-artifacts || true

      - name: Run ${{ matrix.provider }} integration tests
        run: |
          dotnet test pengdows.hangfire.integration.tests/pengdows.hangfire.integration.tests.csproj \
            --configuration Release \
            --framework net8.0 \
            -p:NuGetAudit=false \
            --blame-hang --blame-hang-timeout 120s \
            --filter "FullyQualifiedName~${{ matrix.provider }}"
